<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Table merged</h1>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th rowspan="2">day</th>
                <th colspan="2">time</th>
                <th rowspan="2">subject</th>
            </tr>
            <tr>
                <td>start</td>
                <td>ends</td>
            </tr>
            <tr>
                <td>Month day</td>
                <td>6:30</td>
                <td>9:40</td>
                <td>Math</td>
            </tr>
            <tr>
                <td>Tue day</td>
                <td>7:09</td>
                <td>9:45</td>
                <td>Science</td>
            </tr>
            <tr>
                <td colspan="4">total:2</td>
            </tr>
        </thead>
    </table>

    <hr>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th colspan="6">Time table</th>
            </tr>
            <tr>
                <th rowspan="6">Houres</th>
            </tr>
            <tr>
                <td>Mon</td>
                <td>Tue</td>
                <td>Wed</td>
                <td>Thu</td>
                <td>Fri</td>
            </tr>
            <tr>
                <td>Math</td>
                <td>Science</td>
                <td>English</td>
                <td>History</td>
                <td>PE</td>
            </tr>
            tr>
                <td>6:30-7:30</td>
                <td>7:30-8:30</td>
                <td>8:30-9:30</td>
                <td>9:30-10:30</td>
                <td>10:30-11:30</td>

        </thead>
    </table>
      
</body>
</html>
