<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <main class="d-flex justify-content-center mt-5">
        <button type="button" class="btn btn-primary " data-bs-toggle="modal" data-bs-target="#modalform">Modal Form
        </button>

        <div class="modal fade" id="modalform" data-bs-backdrop="static" >
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5">Modal Form</h1>
                        <button class="btn-close" data-bs-dismiss="modal"></button>

                    </div>
                    <div class="modal-body">
                        <form class="px-5">
                            <h1>Form Register</h1>
                            <div class="mb-3">
                                <label for="" class="form-label">Username</label>
                                <input type="text" class="form-control" placeholder="Enter username" required>
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter email" required>
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Password</label>
                                <select class="form-control">
                                    <option selected disabled>Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>
                            <div class="mb-5">
                                <input type="radio" class="form-check-input">
                                <label for="">Remember me</label>
                            </div>
                            <div class="mb-5 d-flex justify-content-between">
                                <button class="btn btn-success">submit</button>
                                <button class="btn btn-secondary">cancel</button>
                            </div>
                            
                        </form>

                    </div>
                </div>
            </div>
            

        </div>
    </main>

</body>

</html>
