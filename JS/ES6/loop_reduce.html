    <script>
        let array = [11,23,55,77,234]
        let sum = array.reduce((account, current)=>{
            return account+=current
        }, 0);

        console.log(sum);

        let nested = [[10,20],[30,40]]
        let new_arr=nested.reduce((account,current)=> account.concat(current), [])
        console.log(new_arr);
        
        
    </script>
