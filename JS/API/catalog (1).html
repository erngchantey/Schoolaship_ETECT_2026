<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #EEF1F5;
      --ink: #1B2430;
      --ink-soft: #5A6472;
      --line: #C7CDD6;
      --mustard: #C98A2B;
      --teal: #3E7C74;
      --card: #FBFCFD;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 56px 24px 32px;
      max-width: 1200px;
      margin: 0 auto;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--teal);
      margin: 0 0 12px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(36px, 6vw, 64px);
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }

    header p {
      color: var(--ink-soft);
      max-width: 480px;
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .stamp {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 20px;
    }

    .tabs {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-soft);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .tab:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: rise .5s ease forwards;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-id {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--ink-soft);
      background: var(--card);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--line);
      z-index: 2;
    }

    .img-wrap {
      background: #fff;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      border-bottom: 1px solid var(--line);
    }

    .img-wrap img {
      max-height: 140px;
      max-width: 100%;
      object-fit: contain;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .category {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--teal);
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .desc {
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.5;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      margin-top: auto;
    }

    .price {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 15px;
      color: var(--mustard);
    }

    .rating {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
    }

    .state {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--ink-soft);
      text-align: center;
      padding: 80px 20px;
    }

    .skeleton {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      height: 340px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .5;
      }

      50% {
        opacity: .9;
      }
    }
  </style>
</head>

<body>

  <header>
    <p class="eyebrow">Field Catalog &mdash; No. 04</p>
    <h1>The general stock</h1>
    <p>A running inventory pulled live from the warehouse feed. Everything here is real stock, priced as listed, sorted
      as it arrives.</p>
    <p class="stamp" id="countStamp">counting stock&hellip;</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main>
    <div class="grid" id="grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <script>
    let allProducts = [];
    let activeCategory = 'all';

    const grid = document.getElementById('grid');
    const tabsEl = document.getElementById('tabs');
    const countStamp = document.getElementById('countStamp');

    function escapeHtml(str)
    {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function renderTabs()
    {
      const categories = ['all', ...new Set(allProducts.map(p => p.category))];
      tabsEl.innerHTML = categories.map(cat => `
      <button class="tab ${cat === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(cat)}">
        ${escapeHtml(cat)}
      </button>
    `).join('');

      tabsEl.querySelectorAll('.tab').forEach(btn =>
      {
        btn.addEventListener('click', () =>
        {
          activeCategory = btn.dataset.cat;
          renderTabs();
          renderGrid();
        });
      });
    }

    function renderGrid()
    {
      const items = activeCategory === 'all'
        ? allProducts
        : allProducts.filter(p => p.category === activeCategory);

      if (items.length === 0) {
        grid.innerHTML = `<p class="state">Nothing on the shelf for this category.</p>`;
        return;
      }

      grid.innerHTML = items.map((product, i) => `
      <article class="card" style="animation-delay:${Math.min(i * 40, 400)}ms">
        <span class="card-id">#${String(product.id).padStart(3, '0')}</span>
        <div class="img-wrap">
          <img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.title)}" loading="lazy">
        </div>
        <div class="card-body">
          <span class="category">${escapeHtml(product.category)}</span>
          <h2 class="title">${escapeHtml(product.title)}</h2>
          <p class="desc">${escapeHtml(product.description)}</p>
          <div class="price-row">
            <span class="price">$${Number(product.price).toFixed(2)}</span>
            <span class="rating">★ ${product.rating?.rate ?? '—'} (${product.rating?.count ?? 0})</span>
          </div>
        </div>
      </article>
    `).join('');
    }

    fetch('https://fakestoreapi.com/products')
      .then(res =>
      {
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      })
      .then(products =>
      {
        allProducts = products;
        countStamp.textContent = `${products.length} items on the shelf`;
        renderTabs();
        renderGrid();
      })
      .catch(err =>
      {
        grid.innerHTML = `<p class="state">Couldn't reach the warehouse feed. ${escapeHtml(err.message)}</p>`;
        countStamp.textContent = 'stock unavailable';
      });
  </script>

</body>

</html>
