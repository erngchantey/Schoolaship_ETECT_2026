<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-5">

    <!-- submit -->
     <div class="row d-flex justify-content-center mt-5">
        <div class="card col col-6">
            <form class="p-3">
                <h1 class="text-center">Culculate</h1>
                <div>
                    <label class="form-label">Num1</label>
                    <input type="number" class="form-control" id="num1">
                </div>
                <div class="mt-3">
                    <label class="form-label">Num2</label>
                    <input type="number" class="form-control" id="num2">
                </div>
                <div class="mt-3 mb-3">
                    <button type="button" class="btn btn-success" onclick="handleSubmit()">Submit</button>
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
            <div class="mt-3">
                <p id="result"></p>
            </div>
        </div>
     </div>
     <!-- domo -->
      <script>

        function handleSubmit(){
            let num1 = Number(document.getElementById('num1').value);
            let num2 = Number(document.getElementById('num2').value);
            let result = document.getElementById('result');

            let total = num1 + num2
            result.textContent = " Result: " + total;
        }


      </script>


</body>

</html>
