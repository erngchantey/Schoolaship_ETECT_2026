<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    margin{
        margin: 50px;
        margin-top: 100px;
        margin-right: 50px;
        margin-bottom: 50px;
        margin-left: 50px;
    }

    border{
        border: 5px solid black;
        border-width: 5px 10px 15px 20px;
        border-color: red green blue yellow;
        border-style: solid dashed dotted double;
        border-radius: 10px;
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        border-radius: 20px 10px 5px 0px;
    }

    padding{
        padding: 20px;
        padding-top: 40px;
        padding-right: 20px;
        padding-bottom: 20px;
        padding-left: 20px;
        padding: 40px 20px 20px 20px;
    }
    p{
        color:red;
        font-family: Arial, sans-serif;
        text-align: justify;
    }
    main{
        margin: 50px;
        height: 400px;
        width: 400px;
        background-color: rgb(109, 240, 159);
        border-top: 5px solid black;
        border-right: 5px solid black;
        border-bottom: 5px solid black;
        border-left: 5px solid black;
        border-radius: 100%;
        text-align: center;
        box-shadow: 0px 0px 20px 20px greenyellow;
        overflow: hidden;
       
    }

    h1{
    
        margin-top: 180px;
        background-color: red;
        object-fit: cover;
        
    }


</style>
<body>
    <main>
        <img src="../Photo/image.png" alt="photo" width="400px" height="400px">
    </main>
    <main>
        <img src="../Photo/image copy.png" alt="photo" width="400px" height="400px">
    </main>

    
    
</body>
</html>
